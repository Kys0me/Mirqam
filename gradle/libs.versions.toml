# Version catalog. One source of truth for the whole build.
# The Kotlin version and the Compose compiler plugin version MUST match
# (since Kotlin 2.0 the Compose compiler ships inside the Kotlin release).
[versions]
kotlin = "2.1.0"                 # Kotlin + Compose-compiler plugin version (kept in lock-step)
composeMultiplatform = "1.7.3"   # JetBrains Compose Multiplatform (Desktop)
coroutines = "1.9.0"
serialization = "1.7.3"

[plugins]
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm",                version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose               = { id = "org.jetbrains.compose",                   version.ref = "composeMultiplatform" }

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing",   version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
